<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#021327" />
      <stop offset="100%" stop-color="#021327" />
    </linearGradient>

    <!-- Dune Fills: Dark base with subtle green glow from below -->
    <linearGradient id="duneFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#021327" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#05720a" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="seaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05720a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#021327" stop-opacity="1" />
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowWhite" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="viewport">
      <rect width="800" height="300" />
    </clipPath>
  </defs>

  <g clip-path="url(#viewport)">
    <!-- Base -->
    <rect width="800" height="300" fill="#021327" />

    <!-- Abstract Grid Overlay -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.03">
      <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 0 250 L 800 250" />
      <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300 M 500 0 L 500 300 M 600 0 L 600 300 M 700 0 L 700 300" />
    </g>

    <!-- Parallax Dunes (Perfectly seamless curves) -->
    
    <!-- Back Dune -->
    <g>
      <path d="M 0 120 C 150 120, 250 70, 400 100 C 550 130, 650 120, 800 120 C 950 120, 1050 70, 1200 100 C 1350 130, 1450 120, 1600 120 L 1600 350 L 0 350 Z" fill="url(#duneFill)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="45s" repeatCount="indefinite" />
      </path>
      <!-- Line art tracing the ridge -->
      <path d="M 0 120 C 150 120, 250 70, 400 100 C 550 130, 650 120, 800 120 C 950 120, 1050 70, 1200 100 C 1350 130, 1450 120, 1600 120" fill="none" stroke="#05720a" stroke-width="1.5" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="45s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Middle Dune -->
    <g>
      <path d="M 0 160 C 200 160, 300 110, 450 140 C 600 170, 650 160, 800 160 C 1000 160, 1100 110, 1250 140 C 1400 170, 1450 160, 1600 160 L 1600 350 L 0 350 Z" fill="url(#duneFill)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="30s" repeatCount="indefinite" />
      </path>
      <path d="M 0 160 C 200 160, 300 110, 450 140 C 600 170, 650 160, 800 160 C 1000 160, 1100 110, 1250 140 C 1400 170, 1450 160, 1600 160" fill="none" stroke="#05720a" stroke-width="2" filter="url(#glowGreen)" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="30s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Front Dune -->
    <g>
      <path d="M 0 200 C 150 200, 250 130, 400 180 C 550 230, 650 200, 800 200 C 950 200, 1050 130, 1200 180 C 1350 230, 1450 200, 1600 200 L 1600 350 L 0 350 Z" fill="url(#duneFill)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="20s" repeatCount="indefinite" />
      </path>
      <!-- White line for high contrast -->
      <path d="M 0 200 C 150 200, 250 130, 400 180 C 550 230, 650 200, 800 200 C 950 200, 1050 130, 1200 180 C 1350 230, 1450 200, 1600 200" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="20s" repeatCount="indefinite" />
      </path>
      
      <!-- Data Streams -->
      <path d="M 0 200 C 150 200, 250 130, 400 180 C 550 230, 650 200, 800 200 C 950 200, 1050 130, 1200 180 C 1350 230, 1450 200, 1600 200" fill="none" stroke="#05720a" stroke-width="4" stroke-dasharray="15 500" filter="url(#glowGreen)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="20s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="515;0" dur="4s" repeatCount="indefinite" />
      </path>
      <path d="M 0 200 C 150 200, 250 130, 400 180 C 550 230, 650 200, 800 200 C 950 200, 1050 130, 1200 180 C 1350 230, 1450 200, 1600 200" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="5 700" filter="url(#glowWhite)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="20s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="0;705" dur="5s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Sea Waves in foreground -->
    <g opacity="0.9">
      <path d="M 0 250 C 200 230, 400 280, 800 240 C 1200 200, 1400 250, 1600 240 L 1600 350 L 0 350 Z" fill="url(#seaFill)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="18s" repeatCount="indefinite" />
      </path>
      <path d="M 0 250 C 200 230, 400 280, 800 240 C 1200 200, 1400 250, 1600 240" fill="none" stroke="#05720a" stroke-width="1.5" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="18s" repeatCount="indefinite" />
      </path>

      <path d="M 0 270 C 250 290, 450 240, 800 270 C 1150 300, 1350 250, 1600 270 L 1600 350 L 0 350 Z" fill="#021327" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="12s" repeatCount="indefinite" />
      </path>
      <path d="M 0 270 C 250 290, 450 240, 800 270 C 1150 300, 1350 250, 1600 270" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="12s" repeatCount="indefinite" />
      </path>
    </g>
    
    <!-- Central Green Tech Node (Pulsing) -->
    <circle cx="650" cy="80" r="8" fill="#05720a" filter="url(#glowGreen)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="80" r="3" fill="#ffffff" />
    <circle cx="650" cy="80" r="16" fill="none" stroke="#05720a" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="10;25;10" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
